[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boamotion"
dynamic = ["version"]
description = "Quantify muscle contraction from video microscopy, a Python port of the MUSCLEMOTION ImageJ macro"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Roman Schwob", email = "roman.schwob@students.unibe.ch" }]
keywords = ["microscopy", "muscle", "contraction", "cardiomyocyte", "image-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.1.23",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "nbclient>=0.10"]

[project.urls]
Homepage = "https://github.com/quasar1357/boamotion"
Issues = "https://github.com/quasar1357/boamotion/issues"

[tool.hatch.version]
path = "src/boamotion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/boamotion"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear, simplify, numpy
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
# `validation` is not part of the package, so its tests need it on the path.
testpaths = ["tests", "validation"]
pythonpath = ["validation"]
addopts = "-q"
